[project]
name = "fastapi-journalblog"
version = "0.1.0"
description = "Asynchronous journal blog API"
authors = [{name = "Pavlov Danil", email = "danpavkzn@mail.ru"}]
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "bcrypt>=4.2.1,<5",
    "email-validator>=2.2,<3",
    "fastapi>=0.115.6,<1",
    "greenlet>=3.1,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt[crypto]>=2.10.1,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn>=0.34,<1",
    "redis>=6.1,<7",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "fakeredis[lua]>=2.28,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv-check", ".tools", ".cache", "src/migrations/versions/05cd72823cc7_123.py", "src/migrations/versions/fd642891166b_pc.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
